name: Королевский дайджест

on:
  schedule:
    - cron: '37 3 * * *'
    - cron: '19 6 * * *'
    - cron: '11 9 * * *'
    - cron: '41 12 * * *'   # 08:00 МСК — страховка после утренних попыток
  workflow_dispatch: {}     # можно запускать вручную

permissions:
  contents: write

concurrency:
  group: royal-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Собрать выпуск
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/build_digest.mjs

      - name: Опубликовать, если появился новый выпуск
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name  "royal-digest-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "Королевский дайджест — авто-выпуск (GitHub Actions)"
            git push
          else
            echo "изменений нет — страница уже актуальна"
          fi
